name: EAS Build Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: eas-build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-preview-archive:
    name: Android preview archive check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Inspect Android preview archive
        run: eas build:inspect --platform android --profile preview --stage archive --output /tmp/eas-archive --force
